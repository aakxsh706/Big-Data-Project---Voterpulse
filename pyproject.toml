[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voterpulse-lite"
version = "1.0.0"
description = "Local, free dashboard that tracks the tone of Indian election news coverage by policy issue."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.50,<2",
    "feedparser>=6.0,<7",
    "requests>=2.31,<3",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "pandas>=2.1",
    "plotly>=5.20",
    "APScheduler>=3.10,<4",
    "vaderSentiment==3.3.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
